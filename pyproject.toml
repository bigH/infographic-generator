[project]
name = "infographic-generator"
version = "0.1.0"
description = "Turn a text prompt into a researched, illustrated infographic PNG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
]

[project.scripts]
infographic = "infographic_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infographic_generator"]

# The stub stages read their fixtures from the repo-root ``assets/``, which the tests
# also point at. Ship a copy inside the package so an installed wheel finds them too.
[tool.hatch.build.targets.wheel.force-include]
"assets" = "infographic_generator/assets"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
